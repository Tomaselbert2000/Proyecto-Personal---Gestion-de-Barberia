<!DOCTYPE html>
<html lang="es" th:attr="data-theme=${@appPreferences.getTheme()}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Modificar Stock - LA TERCERA BARBERSHOP</title>
    <th:block th:replace="~{fragments/layout :: headAssets}"></th:block>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            -webkit-font-smoothing: antialiased
        }

        .app-header {
            position: sticky;
            top: 0;
            z-index: 6;
            display: flex;
            align-items: center;
            gap: 4px;
            height: 64px;
            padding: 0 8px;
            background: var(--md-sys-color-surface-container-low);
            border-bottom: 1px solid var(--md-sys-color-outline-variant)
        }

        .app-header-titles {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
            margin-left: 8px
        }

        .app-header-titles span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .app-shell {
            display: flex;
            min-height: calc(100vh - 64px)
        }

        .nav-drawer {
            position: fixed;
            top: 64px;
            bottom: 0;
            left: 0;
            z-index: 5;
            width: min(320px, 84vw);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            background: var(--md-sys-color-surface-container-low);
            border-right: 1px solid var(--md-sys-color-outline-variant);
            transform: translateX(-105%);
            transition: transform 200ms ease
        }

        .nav-drawer.open {
            transform: translateX(0)
        }

        .nav-scrim {
            position: fixed;
            inset: 64px 0 0 0;
            z-index: 4;
            background: rgba(0, 0, 0, .4);
            opacity: 0;
            pointer-events: none;
            transition: opacity 200ms ease
        }

        .nav-scrim.open {
            opacity: 1;
            pointer-events: auto
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px
        }

        .nav-brand img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover
        }

        .nav-brand-copy {
            display: flex;
            flex-direction: column;
            line-height: 1.3;
            min-width: 0
        }

        .app-main {
            flex: 1;
            min-width: 0;
            width: 100%;
            padding: 20px 16px 40px
        }

        .main-inner {
            max-width: 720px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px
        }

        .page-header {
            display: flex;
            flex-direction: column;
            gap: 4px
        }

        .surface {
            position: relative;
            isolation: isolate;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 20px;
            border-radius: 16px;
            background: var(--md-sys-color-surface-container-low);
            --md-elevation-level: 1
        }

        .surface.outlined {
            background: var(--md-sys-color-surface);
            border: 1px solid var(--md-sys-color-outline-variant);
            --md-elevation-level: 0
        }

        .stock-product-head {
            display: flex;
            align-items: center;
            gap: 14px
        }

        .product-thumb {
            position: relative;
            flex-shrink: 0;
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: var(--md-sys-color-surface-container);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--md-sys-color-secondary)
        }

        .product-thumb md-icon {
            font-size: 28px
        }

        .product-thumb img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        .stock-product-copy {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0
        }

        .stock-product-copy .name {
            min-width: 0;
            overflow-wrap: anywhere
        }

        .product-meta {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
            color: var(--md-sys-color-on-surface-variant)
        }

        .product-meta md-icon {
            font-size: 16px;
            flex-shrink: 0
        }

        .stock-form {
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 16px
        }

        .stock-form md-outlined-select,
        .stock-form md-outlined-text-field {
            width: 100%
        }

        .btn-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 4px
        }

        .btn-row md-outlined-button,
        .btn-row md-filled-button {
            flex: 1;
            min-width: 160px;
            height: 40px
        }

        .hint {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--md-sys-color-on-surface-variant)
        }

        .hint md-icon {
            font-size: 16px;
            flex-shrink: 0
        }

        @media (min-width: 600px) {
            .app-main {
                padding: 28px 24px 48px
            }
        }

        @media (min-width: 840px) {
            .nav-toggle {
                display: none
            }

            .nav-scrim {
                display: none
            }

            .nav-drawer {
                position: sticky;
                top: 64px;
                height: calc(100vh - 64px);
                transform: none
            }

            .app-main {
                padding: 32px 32px 56px
            }
        }
    </style>
</head>
<body>
<header th:replace="~{fragments/layout :: header(title='Modificar Stock', backHref='/products', backLabel='Volver a productos')}"></header>

<div class="nav-scrim" id="navScrim"></div>

<div class="app-shell">
    <aside th:replace="~{fragments/layout :: drawer(active='/products')}"></aside>

    <main class="app-main">
        <div class="main-inner">
            <div class="page-header">
                <h1 class="md-typescale-headline-small" style="margin:0">Modificar Stock</h1>
                <p class="md-typescale-body-medium" style="margin:0;color:var(--md-sys-color-on-surface-variant)">Elegí
                    la operación y la cantidad para
                    actualizar el stock del producto</p>
            </div>

            <div class="surface outlined">
                <md-elevation></md-elevation>

                <div class="stock-product-head">
                    <div aria-hidden="true" class="product-thumb">
                        <md-icon>inventory_2</md-icon>
                    </div>
                    <div class="stock-product-copy">
                        <span class="md-typescale-title-medium name" th:text="${product.name}">Producto</span>
                        <div class="product-meta md-typescale-body-small">
                            <md-icon aria-hidden="true">inventory_2</md-icon>
                            <span th:text="'Stock actual: ' + ${product.currentStockLevel}">Stock</span>
                            <span style="color:var(--md-sys-color-outline)">·</span>
                            <span th:text="'Min: ' + ${product.safetyStockLevel}">Min</span>
                        </div>
                    </div>
                </div>

                <md-divider></md-divider>
                <form class="stock-form" method="post" th:action="@{/products/{id}/update-stock(id=${product.id})}"
                      th:attr="data-current-stock=${product.currentStockLevel}">
                    <md-outlined-select label="Operación" name="operation">
                        <md-select-option selected value="ADD">
                            <div slot="headline">Agregar stock</div>
                        </md-select-option>
                        <md-select-option value="REMOVE">
                            <div slot="headline">Quitar stock</div>
                        </md-select-option>
                    </md-outlined-select>
                    <md-outlined-text-field id="quantityField" label="Cantidad" min="0" name="quantity" placeholder="Cantidad a gestionar"
                                            required step="1" type="number">
                        <md-icon slot="leading-icon">add</md-icon>
                    </md-outlined-text-field>
                    <p class="hint md-typescale-body-small">
                        <md-icon aria-hidden="true">info</md-icon>
                        <span>Para quitar stock, ingresá un valor positivo y menor o igual al stock actual.</span>
                    </p>
                    <div class="btn-row">
                        <md-filled-button type="submit">
                            <md-icon slot="icon">save</md-icon>
                            Guardar Cambios
                        </md-filled-button>
                        <md-outlined-button href="/products" th:href="@{/products}">
                            <md-icon slot="icon">close</md-icon>
                            Cancelar
                        </md-outlined-button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/layout :: dialogs}"></div>
<script>
    const form = document.querySelector('.stock-form');
    if (form) {
        const select = form.querySelector('md-outlined-select[name="operation"]');
        const field = document.getElementById('quantityField');
        const currentStock = parseInt(form.dataset.currentStock || '0', 10);
        const icon = field ? field.querySelector('md-icon[slot="leading-icon"]') : null;

        select.addEventListener('change', () => {
            const value = select.value;
            if (icon) {
                icon.textContent = value === 'REMOVE' ? 'remove' : 'add';
            }
            if (field) field.removeAttribute('error-text');
        });

        form.addEventListener('submit', (e) => {
            const q = parseInt(field.value, 10);
            const isRemove = select.value === 'REMOVE';
            let error = null;
            if (isNaN(q) || q <= 0) {
                error = 'Ingresá una cantidad entera mayor a cero';
            } else if (isRemove && q > currentStock) {
                error = 'La cantidad no puede superar el stock actual (' + currentStock + ')';
            }
            if (error) {
                e.preventDefault();
                field.setAttribute('error-text', error);
            }
        });
    }
</script>
<script th:replace="~{fragments/layout :: commonScripts}"></script>
</body>
</html>
