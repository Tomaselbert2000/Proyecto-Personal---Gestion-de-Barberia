<!DOCTYPE html>
<html lang="es" th:attr="data-theme=${@appPreferences.getTheme()}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Nuevo Servicio - LA TERCERA BARBERSHOP</title>
    <th:block th:replace="~{fragments/layout :: headAssets}"></th:block>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            -webkit-font-smoothing: antialiased
        }

        .app-header {
            position: sticky;
            top: 0;
            z-index: 6;
            display: flex;
            align-items: center;
            gap: 4px;
            height: 64px;
            padding: 0 8px;
            background: var(--md-sys-color-surface-container-low);
            border-bottom: 1px solid var(--md-sys-color-outline-variant)
        }

        .app-header-titles {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
            margin-left: 8px
        }

        .app-header-titles span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .app-shell {
            display: flex;
            min-height: calc(100vh - 64px)
        }

        .nav-drawer {
            position: fixed;
            top: 64px;
            bottom: 0;
            left: 0;
            z-index: 5;
            width: min(320px, 84vw);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            background: var(--md-sys-color-surface-container-low);
            border-right: 1px solid var(--md-sys-color-outline-variant);
            transform: translateX(-105%);
            transition: transform 200ms ease
        }

        .nav-drawer.open {
            transform: translateX(0)
        }

        .nav-scrim {
            position: fixed;
            inset: 64px 0 0 0;
            z-index: 4;
            background: rgba(0, 0, 0, .4);
            opacity: 0;
            pointer-events: none;
            transition: opacity 200ms ease
        }

        .nav-scrim.open {
            opacity: 1;
            pointer-events: auto
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px
        }

        .nav-brand img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover
        }

        .nav-brand-copy {
            display: flex;
            flex-direction: column;
            line-height: 1.3;
            min-width: 0
        }

        .app-main {
            flex: 1;
            min-width: 0;
            width: 100%;
            padding: 20px 16px 40px
        }

        .main-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 28px
        }

        .page-header {
            display: flex;
            flex-direction: column;
            gap: 4px
        }

        .surface {
            position: relative;
            isolation: isolate;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 20px;
            border-radius: 16px;
            background: var(--md-sys-color-surface-container-low);
            --md-elevation-level: 1
        }

        .surface.outlined {
            background: var(--md-sys-color-surface);
            border: 1px solid var(--md-sys-color-outline-variant);
            --md-elevation-level: 0
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px
        }

        .form-grid md-outlined-text-field,
        .form-grid md-outlined-select {
            width: 100%
        }

        .btn-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 16px
        }

        .btn-row md-outlined-button,
        .btn-row md-filled-button {
            flex: 1;
            min-width: 150px;
            height: 40px
        }

        .error-item {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            padding: 4px 0
        }

        .error-item::before {
            content: '•';
            color: var(--md-sys-color-error)
        }

        @media (min-width: 600px) {
            .app-main {
                padding: 28px 24px 48px
            }

            .form-grid {
                grid-template-columns: repeat(2, 1fr)
            }

            .span-full {
                grid-column: 1 / -1
            }
        }

        @media (min-width: 840px) {
            .nav-toggle {
                display: none
            }

            .nav-scrim {
                display: none
            }

            .nav-drawer {
                position: sticky;
                top: 64px;
                height: calc(100vh - 64px);
                transform: none
            }

            .app-main {
                padding: 32px 32px 56px
            }
        }
    </style>
</head>
<body>
<header th:replace="~{fragments/layout :: header(title='Nuevo Servicio', backHref='', backLabel='')}"></header>

<div class="nav-scrim" id="navScrim"></div>

<div class="app-shell">
    <aside th:replace="~{fragments/layout :: drawer(active='/barberservices')}"></aside>

    <main class="app-main">
        <div class="main-inner">
            <div class="page-header">
                <h1 class="md-typescale-headline-small" style="margin:0">Nuevo Servicio</h1>
                <p class="md-typescale-body-medium" style="margin:0;color:var(--md-sys-color-on-surface-variant)">
                    Registra un nuevo servicio en el catálogo de la barbería</p>
            </div>

            <section aria-label="Formulario de registro de servicio">
                <form method="post" th:action="@{/barberservices/new}">
                    <input th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden">
                    <div class="surface outlined">
                        <div class="form-grid">
                            <md-outlined-text-field id="serviceName" label="Nombre del servicio" maxlength="100"
                                                    name="name" placeholder="Ej: Corte Clásico"
                                                    th:value="${dto.name}">
                                <md-icon slot="leading-icon">cut</md-icon>
                            </md-outlined-text-field>

                            <md-outlined-text-field id="servicePrice" label="Precio" min="0"
                                                    name="price" placeholder="Ej: 12000" step="0.01"
                                                    th:value="${dto.price}" type="number">
                                <md-icon slot="leading-icon">payments</md-icon>
                            </md-outlined-text-field>

                            <md-outlined-select id="categorySelect" label="Categoría" name="serviceCategory">
                                <md-select-option th:selected="${dto.serviceCategory == null}" value="">
                                    <div slot="headline">Seleccionar categoría</div>
                                </md-select-option>
                                <md-select-option th:each="cat : ${categories}"
                                                  th:if="${cat.name() != 'TODOS'}"
                                                  th:selected="${dto.serviceCategory != null and dto.serviceCategory.name() == cat.name()}"
                                                  th:value="${cat}">
                                    <div slot="headline" th:text="${cat.displayName}"></div>
                                </md-select-option>
                            </md-outlined-select>

                            <md-outlined-text-field class="span-full" id="internalNotes" label="Notas internas"
                                                    maxlength="256" name="internalNotes" placeholder="Notas internas para el personal (no visible para clientes)" rows="3"
                                                    th:value="${dto.internalNotes}"
                                                    type="textarea">
                                <md-icon slot="leading-icon">notes</md-icon>
                            </md-outlined-text-field>
                        </div>

                        <div class="btn-row">
                            <md-filled-button type="submit">
                                <md-icon slot="icon">check</md-icon>
                                Guardar Servicio
                            </md-filled-button>
                            <md-outlined-button onclick="resetForm()" type="button">
                                <md-icon slot="icon">autorenew</md-icon>
                                Limpiar
                            </md-outlined-button>
                            <md-outlined-button href="/barberservices">
                                <md-icon slot="icon">arrow_back</md-icon>
                                Cancelar
                            </md-outlined-button>
                        </div>
                    </div>
                </form>
            </section>
        </div>
    </main>
</div>

<md-dialog id="validationDialog">
    <div class="md-typescale-headline-small" slot="headline">No se pudo registrar el servicio en el catálogo. Por favor,
        revisa lo siguiente:
    </div>
    <div class="md-typescale-body-medium" slot="content">
        <div th:if="${validationErrors != null and !#lists.isEmpty(validationErrors)}">
            <div class="error-item" th:each="error : ${validationErrors}">
                <span th:text="${error}">Error</span>
            </div>
        </div>
    </div>
    <div slot="actions">
        <md-text-button id="validationClose">Aceptar</md-text-button>
    </div>
</md-dialog>

<div th:replace="~{fragments/layout :: dialogs}"></div>
<script>
    function resetForm() {
        window.location.href = '/barberservices/new';
    }

    const validationDialog = document.getElementById('validationDialog');
    const validationClose = document.getElementById('validationClose');
    validationClose.addEventListener('click', () => validationDialog.close());
    if (document.querySelectorAll('#validationDialog .error-item').length > 0) {
        validationDialog.show();
    }

</script>
<script th:replace="~{fragments/layout :: commonScripts}"></script>
</body>
</html>
