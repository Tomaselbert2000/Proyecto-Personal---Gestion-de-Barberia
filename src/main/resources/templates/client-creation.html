<!DOCTYPE html>
<html lang="es" th:attr="data-theme=${@appPreferences.getTheme()}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Nuevo Cliente - LA TERCERA BARBERSHOP</title>
    <th:block th:replace="~{fragments/layout :: headAssets}"></th:block>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            -webkit-font-smoothing: antialiased
        }

        .app-header {
            position: sticky;
            top: 0;
            z-index: 6;
            display: flex;
            align-items: center;
            gap: 4px;
            height: 64px;
            padding: 0 8px;
            background: var(--md-sys-color-surface-container-low);
            border-bottom: 1px solid var(--md-sys-color-outline-variant)
        }

        .app-header-titles {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
            margin-left: 8px
        }

        .app-header-titles span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .app-shell {
            display: flex;
            min-height: calc(100vh - 64px)
        }

        .nav-drawer {
            position: fixed;
            top: 64px;
            bottom: 0;
            left: 0;
            z-index: 5;
            width: min(320px, 84vw);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            background: var(--md-sys-color-surface-container-low);
            border-right: 1px solid var(--md-sys-color-outline-variant);
            transform: translateX(-105%);
            transition: transform 200ms ease
        }

        .nav-drawer.open {
            transform: translateX(0)
        }

        .nav-scrim {
            position: fixed;
            inset: 64px 0 0 0;
            z-index: 4;
            background: color-mix(in srgb, var(--md-sys-color-scrim) 40%, transparent);
            opacity: 0;
            pointer-events: none;
            transition: opacity 200ms ease
        }

        .nav-scrim.open {
            opacity: 1;
            pointer-events: auto
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px
        }

        .nav-brand img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover
        }

        .nav-brand-copy {
            display: flex;
            flex-direction: column;
            line-height: 1.3;
            min-width: 0
        }

        .app-main {
            flex: 1;
            min-width: 0;
            width: 100%;
            padding: 20px 16px 40px
        }

        .main-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 28px
        }

        .page-header {
            display: flex;
            flex-direction: column;
            gap: 4px
        }

        .surface {
            position: relative;
            isolation: isolate;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 20px;
            border-radius: 16px;
            background: var(--md-sys-color-surface-container-low);
            --md-elevation-level: 1
        }

        .surface.outlined {
            background: var(--md-sys-color-surface);
            border: 1px solid var(--md-sys-color-outline-variant);
            --md-elevation-level: 0
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px
        }

        .form-grid md-outlined-text-field,
        .form-grid md-outlined-select {
            width: 100%
        }

        .phones-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap
        }

        .phone-row {
            display: flex;
            align-items: center;
            gap: 8px
        }

        .phone-row md-outlined-text-field {
            flex: 1;
            min-width: 0
        }

        .phone-row md-icon-button {
            flex-shrink: 0
        }

        .btn-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 16px
        }

        .btn-row md-outlined-button,
        .btn-row md-filled-button {
            flex: 1;
            min-width: 150px;
            height: 40px
        }

        .error-item {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            padding: 4px 0
        }

        .error-item::before {
            content: '•';
            color: var(--md-sys-color-error)
        }

        @media (min-width: 600px) {
            .app-main {
                padding: 28px 24px 48px
            }

            .form-grid {
                grid-template-columns: repeat(2, 1fr)
            }

            .span-full {
                grid-column: 1 / -1
            }
        }

        @media (min-width: 840px) {
            .nav-toggle {
                display: none
            }

            .nav-scrim {
                display: none
            }

            .nav-drawer {
                position: sticky;
                top: 64px;
                height: calc(100vh - 64px);
                transform: none
            }

            .app-main {
                padding: 32px 32px 56px
            }
        }
    </style>
</head>
<body>
<header th:replace="~{fragments/layout :: header(title='Nuevo Cliente', backHref='', backLabel='')}"></header>

<div class="nav-scrim" id="navScrim"></div>

<div class="app-shell">
    <aside th:replace="~{fragments/layout :: drawer(active='/clients')}"></aside>

    <main class="app-main">
        <div class="main-inner">
            <div class="page-header">
                <h1 class="md-typescale-headline-small" style="margin:0">Nuevo Cliente</h1>
                <p class="md-typescale-body-medium" style="margin:0;color:var(--md-sys-color-on-surface-variant)">
                    Registra un nuevo cliente en el sistema de la barbería</p>
            </div>

            <section aria-label="Formulario de registro de cliente">
                <form method="post" th:action="@{/clients/new}">
                    <div class="surface outlined">
                        <div class="form-grid">
                            <md-outlined-text-field id="clientDNI" inputmode="numeric" label="DNI"
                                                    maxlength="8" name="nationalIdentityCardNumber"
                                                    placeholder="Ej: 12345678"
                                                    th:value="${dto.nationalIdentityCardNumber}">
                                <md-icon aria-hidden="true" slot="leading-icon">badge</md-icon>
                            </md-outlined-text-field>

                            <md-outlined-text-field id="clientFirstName" label="Nombre" maxlength="100"
                                                    name="firstName" placeholder="Ej: Juan" th:value="${dto.firstName}">
                                <md-icon aria-hidden="true" slot="leading-icon">person</md-icon>
                            </md-outlined-text-field>

                            <md-outlined-text-field id="clientLastName" label="Apellido" maxlength="100"
                                                    name="lastName" placeholder="Ej: Pérez" th:value="${dto.lastName}">
                                <md-icon aria-hidden="true" slot="leading-icon">person_outline</md-icon>
                            </md-outlined-text-field>

                            <md-outlined-text-field id="clientEmail" label="Correo electrónico" maxlength="100"
                                                    name="email" placeholder="Ej: juan@gmail.com"
                                                    th:value="${dto.email}"
                                                    type="email">
                                <md-icon aria-hidden="true" slot="leading-icon">mail</md-icon>
                            </md-outlined-text-field>

                            <div class="span-full">
                                <div class="phones-header">
                                    <span class="md-typescale-title-small">Teléfonos</span>
                                    <md-outlined-button id="addPhoneBtn" type="button">
                                        <md-icon aria-hidden="true" slot="icon">add</md-icon>
                                        Agregar teléfono
                                    </md-outlined-button>
                                </div>
                                <div id="phonesContainer"
                                     style="display:flex;flex-direction:column;gap:8px;margin-top:12px">
                                    <div class="phone-row" th:each="phone, iter : ${dto.phoneNumbersList}">
                                        <md-outlined-text-field label="Teléfono"
                                                                maxlength="15" placeholder="+54 9 1234 5678"
                                                                th:name="${'phoneNumbersList[' + iter.index + ']'}"
                                                                th:value="${phone}" type="tel">
                                            <md-icon aria-hidden="true" slot="leading-icon">phone</md-icon>
                                        </md-outlined-text-field>
                                        <md-icon-button aria-label="Eliminar teléfono" class="removePhone"
                                                        type="button">
                                            <md-icon aria-hidden="true">delete</md-icon>
                                        </md-icon-button>
                                    </div>
                                </div>
                            </div>

                            <md-outlined-text-field class="span-full" id="clientNotes" label="Notas opcionales"
                                                    maxlength="256" name="optionalNotes"
                                                    placeholder="Agrega notas sobre el cliente (alergias, preferencias, etc.)"
                                                    rows="3"
                                                    th:value="${dto.optionalNotes}"
                                                    type="textarea">
                                <md-icon aria-hidden="true" slot="leading-icon">notes</md-icon>
                            </md-outlined-text-field>
                        </div>

                        <div class="btn-row">
                            <md-filled-button type="submit">
                                <md-icon aria-hidden="true" slot="icon">check</md-icon>
                                Guardar Cliente
                            </md-filled-button>
                            <md-outlined-button onclick="resetForm(this)" type="button">
                                <md-icon aria-hidden="true" slot="icon">autorenew</md-icon>
                                Limpiar
                            </md-outlined-button>
                            <md-outlined-button href="/clients">
                                <md-icon aria-hidden="true" slot="icon">arrow_back</md-icon>
                                Cancelar
                            </md-outlined-button>
                        </div>
                    </div>
                </form>
            </section>
        </div>
    </main>
</div>

<md-dialog id="validationDialog">
    <div class="md-typescale-headline-small" slot="headline">No se pudo registrar el cliente. Por favor, revisa lo
        siguiente:
    </div>
    <div class="md-typescale-body-medium" slot="content">
        <div th:if="${validationErrors != null and !#lists.isEmpty(validationErrors)}">
            <div class="error-item" th:each="error : ${validationErrors}">
                <span th:text="${error}">Error</span>
            </div>
        </div>
    </div>
    <div slot="actions">
        <md-text-button id="validationClose">Aceptar</md-text-button>
    </div>
</md-dialog>

<div th:replace="~{fragments/layout :: dialogs}"></div>
<script>
    function resetForm(source) {
        resetFormInPlace(source.closest('form'));
    }

    const validationDialog = document.getElementById('validationDialog');
    const validationClose = document.getElementById('validationClose');
    validationClose.addEventListener('click', () => validationDialog.close());
    if (document.querySelectorAll('#validationDialog .error-item').length > 0) {
        validationDialog.show();
    }

    const phonesContainer = document.getElementById('phonesContainer');
    const addPhoneBtn = document.getElementById('addPhoneBtn');

    function renumberPhoneRows() {
        document.querySelectorAll('#phonesContainer .phone-row').forEach((row, i) => {
            row.querySelector('md-outlined-text-field').setAttribute('name', 'phoneNumbersList[' + i + ']');
        });
    }

    function createPhoneRow() {
        const row = document.createElement('div');
        row.className = 'phone-row';
        const field = document.createElement('md-outlined-text-field');
        field.setAttribute('label', 'Teléfono');
        field.setAttribute('type', 'tel');
        field.setAttribute('maxlength', '15');
        field.setAttribute('placeholder', '+54 9 1234 5678');
        const fieldIcon = document.createElement('md-icon');
        fieldIcon.setAttribute('slot', 'leading-icon');
        fieldIcon.textContent = 'phone';
        field.appendChild(fieldIcon);
        const remove = document.createElement('md-icon-button');
        remove.setAttribute('type', 'button');
        remove.setAttribute('class', 'removePhone');
        remove.setAttribute('aria-label', 'Eliminar teléfono');
        const removeIcon = document.createElement('md-icon');
        removeIcon.textContent = 'delete';
        remove.appendChild(removeIcon);
        row.appendChild(field);
        row.appendChild(remove);
        return row;
    }

    function addPhoneRow() {
        phonesContainer.appendChild(createPhoneRow());
        renumberPhoneRows();
    }

    function removePhoneRow(button) {
        const row = button.closest('.phone-row');
        if (row) row.remove();
        renumberPhoneRows();
    }

    addPhoneBtn.addEventListener('click', addPhoneRow);
    phonesContainer.addEventListener('click', (event) => {
        const remove = event.target.closest('.removePhone');
        if (remove) removePhoneRow(remove);
    });
    if (document.querySelectorAll('#phonesContainer .phone-row').length === 0) {
        addPhoneRow();
    } else {
        renumberPhoneRows();
    }
</script>
<script th:replace="~{fragments/layout :: commonScripts}"></script>
</body>
</html>
