<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:attr="data-theme=${@appPreferences.getTheme()}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Sistema de Gestión</title>
    <script type="importmap">
        { "imports": { "@material/web/": "https://esm.run/@material/web/" } }
    </script>
    <script type="module">
        import '@material/web/all.js';
        import {styles as typescaleStyles} from '@material/web/typography/md-typescale-styles.js';
        document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
          rel="stylesheet">
    <link rel="stylesheet" href="/css/theme.css">
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            -webkit-font-smoothing: antialiased
        }

        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px
        }

        .auth-card {
            position: relative;
            isolation: isolate;
            width: 100%;
            max-width: 400px;
            padding: 24px;
            border-radius: 16px;
            background: var(--md-sys-color-surface-container-low);
            display: flex;
            flex-direction: column;
            --md-elevation-level: 3
        }

        .auth-logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 16px;
            display: block
        }

        .auth-title {
            text-align: center;
            margin: 0 0 4px 0
        }

        .auth-subtitle {
            text-align: center;
            margin: 0 0 24px 0;
            color: var(--md-sys-color-on-surface-variant)
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 16px
        }

        .remember-row {
            display: flex;
            align-items: center;
            gap: 12px
        }

        .remember-row label {
            cursor: pointer
        }

        .auth-footer {
            text-align: center;
            margin-top: 24px
        }

        .auth-submit {
            width: 100%;
            height: 48px
        }
    </style>
</head>
<body>
<div class="login-page">
    <div class="auth-card">
        <md-elevation></md-elevation>
        <img src="/images/Logo.jpg" alt="Logo Barbería" class="auth-logo">
        <h1 class="md-typescale-headline-small auth-title">Sistema de Gestión</h1>
        <p class="md-typescale-body-large auth-subtitle">Bienvenido de nuevo</p>
        <form th:action="@{/login}" method="post" class="auth-form">
            <md-outlined-text-field label="Nombre de usuario" type="text" name="username" required>
                <md-icon slot="leading-icon">person</md-icon>
            </md-outlined-text-field>
            <md-outlined-text-field label="Contraseña" type="password" name="password" required id="passwordInput">
                <md-icon slot="leading-icon">lock</md-icon>
                <md-icon-button toggle slot="trailing-icon" aria-label="Mostrar contraseña"
                                onclick="togglePassword('passwordInput', this)">
                    <md-icon>visibility</md-icon>
                    <md-icon slot="selected">visibility_off</md-icon>
                </md-icon-button>
            </md-outlined-text-field>
            <div class="remember-row">
                <md-checkbox id="rememberSession" touch-target="wrapper"></md-checkbox>
                <label for="rememberSession" class="md-typescale-body-medium">Mantener sesión iniciada</label>
            </div>
            <md-filled-button type="submit" class="auth-submit">Iniciar sesión</md-filled-button>
        </form>
        <div class="auth-footer">
            <p class="md-typescale-body-large" style="margin:0 0 12px 0;color:var(--md-sys-color-on-surface-variant)">¿No eres usuario? Regístrate</p>
            <md-outlined-button href="/register" class="auth-submit">Registrarse</md-outlined-button>
        </div>
    </div>
</div>
<script>
    function togglePassword(id, button) {
        const field = document.getElementById(id);
        field.type = field.type === 'password' ? 'text' : 'password';
        button.setAttribute('aria-label', field.type === 'password' ? 'Mostrar contraseña' : 'Ocultar contraseña');
    }
</script>
</body>
</html>
