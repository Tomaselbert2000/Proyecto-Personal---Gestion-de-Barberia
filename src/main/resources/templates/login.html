<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Sistema de Gestión</title>

    <script type="importmap">
        { "imports": { "@material/web/": "https://esm.run/@material/web/" } }
    </script>
    <script type="module">
        import '@material/web/all.js';
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

</head>
<body style="font-family: 'Roboto', sans-serif;">
<div style="display: flex; min-height: 100vh; justify-content: center; align-items: center;">
    <md-card style="width: 100%; max-width: 380px; padding: 24px;" elevation="2">
        <!-- Logo Circular -->
        <div style="display: flex; justify-content: center; margin-bottom: 16px;">
            <img src="/images/Logo.jpg" alt="Logo Barbería"
                 style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; box-shadow: var(--md-sys-elevation-3);">
        </div>

        <!-- Título -->
        <h1 class="md-title-medium" style="text-align: center;">Sistema de Gestión</h1>

        <!-- Subtítulo -->
        <p class="md-body-large" style="text-align: center; color: var(--md-sys-color-on-surface-variant);">Bienvenido
            de nuevo</p>

        <!-- Formulario -->
        <form th:action="@{/login}" method="post" style="display: flex; flex-direction: column; gap: 16px;">
            <!-- Username Field -->
            <md-outlined-text-field label="Nombre de usuario">
                <input type="text" name="username" required class="md-filled-text-field">
            </md-outlined-text-field>

            <!-- Password Field -->
            <md-outlined-text-field label="Contraseña">
                <input type="password" name="password" required class="md-filled-text-field" id="passwordInput">
                <span slot="suffix" style="cursor: pointer; padding: 8px;" onclick="togglePasswordVisibility()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M17.94 18.65a2.828 2.828 0 0 1-3.98-.02l-1.02-1.02a2.828 2.828 0 0 1 .02-4l7.65-7.65c.85-.85 2.22-.85 3.07 0l.9.9c.85.85.85 2.22 0 3.07L17.94 18.65ZM12 10a2 2 0 1 1-4 0 2 2 0 0 1 4 0Z"
                              stroke="currentColor" stroke-width="2"/>
                        <path d="M2 12s3.7-5.8 9.6-6c5.9-.2 9.8 6 9.8 6" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </span>
            </md-outlined-text-field>

            <!-- Remember Checkbox -->
            <div style="display: flex; align-items: center; gap: 8px;">
                <md-checkbox id="rememberSession"></md-checkbox>
                <label for="rememberSession" class="md-body-medium">Mantener sesión iniciada</label>
            </div>

            <!-- Login Button -->
            <md-filled-button type="submit" style="height: 48px; width: 100%;">Iniciar sesión</md-filled-button>
        </form>

        <!-- Registro Section -->
        <p class="md-body-large"
           style="text-align: center; color: var(--md-sys-color-on-surface-variant); margin-top: 24px;">¿No eres
            usuario? Regístrate</p>

        <!-- Register Button -->
        <md-outlined-button href="/register" style="height: 40px; width: 100%;">Registrarse</md-outlined-button>

    </md-card>
</div>
<script>
</script>
</body>
</html>
