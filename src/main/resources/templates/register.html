<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro - Sistema de Gestión</title>

    <script type="importmap">
        { "imports": { "@material/web/": "https://esm.run/@material/web/" } }
    </script>
    <script type="module">
        import '@material/web/all.js';
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

</head>
<body style="font-family: 'Roboto', sans-serif;">
<div style="min-height: 100vh; display: flex; flex-direction: column;">
    <!-- Icon Button - Top Left -->
    <a href="/" class="md-icon-button" aria-label="Volver">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none">
            <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" stroke="currentColor" stroke-width="2"/>
        </svg>
    </a>

    <!-- Main Content - Full Width, Aligned Left -->
    <div style="flex: 1; display: flex; flex-direction: column;">
        <!-- Header Section -->
        <header style="padding-top: 24px; padding-left: 24px;">
            <h1 class="md-title-medium">Crear cuenta</h1>
            <p class="md-body-large" style="color: var(--md-sys-color-on-surface-variant); margin-bottom: 32px;">
                Registra un nuevo usuario en el sistema</p>
        </header>

        <!-- Form -->
        <form th:object="${dto}" th:action="@{/register}" method="post"
              style="display: flex; flex-direction: column; gap: 16px; padding-left: 24px; padding-right: 24px">

            <!-- Username Field -->
            <md-outlined-text-field label="Nombre de usuario" required
                                    type="text" name="username" id="username" th:field="*{username}"
                                    placeholder="Ingresá tu nombre de usuario">
            </md-outlined-text-field>

            <!-- Password Field -->
            <md-outlined-text-field label="Contraseña" required
                                    type="password" name="password" id="password" th:field="*{password}"
                                    placeholder="Ingresá tu contraseña">
                <span slot="suffix" style="cursor: pointer; padding: 8px;"
                      onclick="togglePasswordVisibility('password')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M17.94 18.65a2.828 2.828 0 0 1-3.98-.02l-1.02-1.02a2.828 2.828 0 0 1 .02-4l7.65-7.65c.85-.85 2.22-.85 3.07 0l.9.9c.85.85.85 2.22 0 3.07L17.94 18.65ZM12 10a2 2 0 1 1-4 0 2 2 0 0 1 4 0Z"
                              stroke="currentColor" stroke-width="2"/>
                        <path d="M2 12s3.7-5.8 9.6-6c5.9-.2 9.8 6 9.8 6" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </span>
            </md-outlined-text-field>

            <!-- Confirm Password Field -->
            <md-outlined-text-field label="Confirmar contraseña" required
                                    type="password" name="confirmPassword" id="confirmPassword"
                                    placeholder="Repetí tu contraseña">
                <span slot="suffix" style="cursor: pointer; padding: 8px;"
                      onclick="togglePasswordVisibility('confirmPassword')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M17.94 18.65a2.828 2.828 0 0 1-3.98-.02l-1.02-1.02a2.828 2.828 0 0 1 .02-4l7.65-7.65c.85-.85 2.22-.85 3.07 0l.9.9c.85.85.85 2.22 0 3.07L17.94 18.65ZM12 10a2 2 0 1 1-4 0 2 2 0 0 1 4 0Z"
                              stroke="currentColor" stroke-width="2"/>
                        <path d="M2 12s3.7-5.8 9.6-6c5.9-.2 9.8 6 9.8 6" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </span>
            </md-outlined-text-field>

            <!-- Submit Button -->
            <md-filled-button type="submit" style="height: 48px;">Crear usuario</md-filled-button>

        </form>

        <script>
            function togglePasswordVisibility(inputId) {
                const input = document.getElementById(inputId);
                if (input.type === 'password') {
                    input.type = 'text';
                } else {
                    input.type = 'password';
                }
            }
        </script>
    </div>
</div>
</body>
</html>
