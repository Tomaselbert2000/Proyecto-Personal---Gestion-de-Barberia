<!DOCTYPE html>
<html lang="es" th:attr="data-theme=${@appPreferences.getTheme()}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Registro - Sistema de Gestión</title>
    <script type="importmap">
        { "imports": { "@material/web/": "https://esm.run/@material/web/" } }
    </script>
    <script type="module">
        import '@material/web/all.js';
        import {styles as typescaleStyles} from '@material/web/typography/md-typescale-styles.js';
        document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
    </script>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
          rel="stylesheet">
    <link href="/css/theme.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            -webkit-font-smoothing: antialiased
        }

        .register-page {
            max-width: 480px;
            margin: 0 auto;
            padding: 24px 16px 40px;
            display: flex;
            flex-direction: column
        }

        .back-btn {
            align-self: flex-start
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 24px
        }

        .auth-submit {
            height: 48px;
            margin-top: 8px
        }

        .error-item {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            padding: 4px 0
        }

        .error-item::before {
            content: '•';
            color: var(--md-sys-color-error)
        }
    </style>
</head>
<body>
<div class="register-page">
    <md-text-button aria-label="Volver" class="back-btn" th:href="@{/login}">
        <md-icon aria-hidden="true" slot="icon">arrow_back</md-icon>
        Volver
    </md-text-button>
    <header style="margin-top:24px">
        <h1 class="md-typescale-headline-small" style="margin:0">Crear cuenta</h1>
        <p class="md-typescale-body-large" style="color:var(--md-sys-color-on-surface-variant);margin:8px 0 0 0">
            Registra un nuevo usuario en el
            sistema</p>
    </header>
    <div class="md-typescale-body-large" role="alert" style="color:var(--md-sys-color-error);margin-top:16px"
         th:if="${error}"
         th:text="${error}"></div>
    <form class="auth-form" method="post" th:action="@{/register}" th:object="${dto}">
        <input name="hasAdminRights" type="hidden" value="false">
        <md-outlined-text-field id="username" label="Nombre de usuario" name="username"
                                placeholder="Ingresá tu nombre de usuario" required
                                th:value="${dto.username}" type="text">
            <md-icon aria-hidden="true" slot="leading-icon">person</md-icon>
        </md-outlined-text-field>
        <md-outlined-text-field id="password" label="Contraseña" name="password" placeholder="Ingresá tu contraseña"
                                required
                                type="password">
            <md-icon aria-hidden="true" slot="leading-icon">lock</md-icon>
            <md-icon-button aria-label="Mostrar contraseña" onclick="togglePassword('password', this)"
                            slot="trailing-icon"
                            toggle>
                <md-icon aria-hidden="true">visibility</md-icon>
                <md-icon aria-hidden="true" slot="selected">visibility_off</md-icon>
            </md-icon-button>
        </md-outlined-text-field>
        <md-outlined-text-field id="confirmPassword" label="Confirmar contraseña" name="confirmPassword"
                                placeholder="Repetí tu contraseña"
                                required type="password">
            <md-icon aria-hidden="true" slot="leading-icon">lock</md-icon>
            <md-icon-button aria-label="Mostrar contraseña" onclick="togglePassword('confirmPassword', this)"
                            slot="trailing-icon"
                            toggle>
                <md-icon aria-hidden="true">visibility</md-icon>
                <md-icon aria-hidden="true" slot="selected">visibility_off</md-icon>
            </md-icon-button>
        </md-outlined-text-field>
        <md-filled-button class="auth-submit" type="submit">Crear usuario</md-filled-button>
    </form>
    <md-dialog id="validationDialog">
        <div class="md-typescale-headline-small" slot="headline">No se pudo crear la cuenta. Por favor, revisa lo
            siguiente:
        </div>
        <div class="md-typescale-body-medium" slot="content">
            <div th:if="${validationErrors != null and !#lists.isEmpty(validationErrors)}">
                <div class="error-item" th:each="error : ${validationErrors}">
                    <span th:text="${error}">Error</span>
                </div>
            </div>
        </div>
        <div slot="actions">
            <md-text-button id="validationClose">Aceptar</md-text-button>
        </div>
    </md-dialog>
</div>
<script>
    function togglePassword(id, button) {
        const field = document.getElementById(id);
        field.type = field.type === 'password' ? 'text' : 'password';
        button.setAttribute('aria-label', field.type === 'password' ? 'Mostrar contraseña' : 'Ocultar contraseña');
    }

    const validationDialog = document.getElementById('validationDialog');
    const validationClose = document.getElementById('validationClose');
    validationClose.addEventListener('click', () => validationDialog.close());
    if (document.querySelectorAll('#validationDialog .error-item').length > 0) {
        validationDialog.show();
    }
</script>
</body>
</html>
