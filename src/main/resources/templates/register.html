<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:attr="data-theme=${@appPreferences.getTheme()}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro - Sistema de Gestión</title>
    <script type="importmap">
        { "imports": { "@material/web/": "https://esm.run/@material/web/" } }
    </script>
    <script type="module">
        import '@material/web/all.js';
        import {styles as typescaleStyles} from '@material/web/typography/md-typescale-styles.js';
        document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
          rel="stylesheet">
    <link rel="stylesheet" href="/css/theme.css">
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            -webkit-font-smoothing: antialiased
        }

        .register-page {
            max-width: 480px;
            margin: 0 auto;
            padding: 24px 16px 40px;
            display: flex;
            flex-direction: column
        }

        .back-btn {
            align-self: flex-start
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 24px
        }

        .auth-submit {
            height: 48px;
            margin-top: 8px
        }
    </style>
</head>
<body>
<div class="register-page">
    <md-text-button href="/" class="back-btn" aria-label="Volver">
        <md-icon slot="icon">arrow_back</md-icon>
        Volver
    </md-text-button>
    <header style="margin-top:24px">
        <h1 class="md-typescale-headline-small" style="margin:0">Crear cuenta</h1>
        <p class="md-typescale-body-large" style="color:var(--md-sys-color-on-surface-variant);margin:8px 0 0 0">Registra un nuevo usuario en el
            sistema</p>
    </header>
    <div th:if="${error}" th:text="${error}" class="md-typescale-body-large"
         style="color:var(--md-sys-color-error);margin-top:16px"></div>
    <form th:object="${dto}" th:action="@{/register}" method="post" class="auth-form">
        <md-outlined-text-field label="Nombre de usuario" required type="text" name="username" id="username"
                                th:field="*{username}" placeholder="Ingresá tu nombre de usuario">
            <md-icon slot="leading-icon">person</md-icon>
        </md-outlined-text-field>
        <md-outlined-text-field label="Contraseña" required type="password" name="password" id="password"
                                th:field="*{password}" placeholder="Ingresá tu contraseña">
            <md-icon slot="leading-icon">lock</md-icon>
            <md-icon-button toggle slot="trailing-icon" aria-label="Mostrar contraseña"
                            onclick="togglePassword('password', this)">
                <md-icon>visibility</md-icon>
                <md-icon slot="selected">visibility_off</md-icon>
            </md-icon-button>
        </md-outlined-text-field>
        <md-outlined-text-field label="Confirmar contraseña" required type="password" name="confirmPassword"
                                id="confirmPassword" placeholder="Repetí tu contraseña">
            <md-icon slot="leading-icon">lock</md-icon>
            <md-icon-button toggle slot="trailing-icon" aria-label="Mostrar contraseña"
                            onclick="togglePassword('confirmPassword', this)">
                <md-icon>visibility</md-icon>
                <md-icon slot="selected">visibility_off</md-icon>
            </md-icon-button>
        </md-outlined-text-field>
        <md-filled-button type="submit" class="auth-submit">Crear usuario</md-filled-button>
    </form>
</div>
<script>
    function togglePassword(id, button) {
        const field = document.getElementById(id);
        field.type = field.type === 'password' ? 'text' : 'password';
        button.setAttribute('aria-label', field.type === 'password' ? 'Mostrar contraseña' : 'Ocultar contraseña');
    }
</script>
</body>
</html>
