<!DOCTYPE html>
<html lang="es" th:attr="data-theme=${@appPreferences.getTheme()}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Tu turno fue reservado con éxito." name="description">
    <title>Reserva confirmada - LA TERCERA BARBERSHOP</title>
    <script type="importmap">
        { "imports": { "@material/web/": "https://esm.run/@material/web/" } }
    </script>
    <script type="module">
        import '@material/web/all.js';
        import {styles as typescaleStyles} from '@material/web/typography/md-typescale-styles.js';
        document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
    </script>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
          rel="stylesheet">
    <link href="/css/theme.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: 'Roboto', system-ui, sans-serif;
            color: var(--md-sys-color-on-background);
            background: radial-gradient(1100px 520px at 50% -12%, color-mix(in srgb, var(--md-sys-color-primary) 15%, transparent), transparent 70%),
            var(--md-sys-color-background);
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shell {
            width: 100%;
            max-width: 620px;
            padding: 40px 18px;
        }

        /* ---------- Marca ---------- */
        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 26px;
        }

        .brand-logo {
            width: 50px;
            height: 50px;
            display: grid;
            place-items: center;
            border-radius: 16px;
            background: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            box-shadow: 0 4px 14px color-mix(in srgb, var(--md-sys-color-shadow) 16%, transparent);
        }

        .brand-logo md-icon {
            font-size: 28px;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            line-height: 1.15;
        }

        .brand-name {
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: .2px;
        }

        .brand-sub {
            font-size: .78rem;
            color: var(--md-sys-color-on-surface-variant);
        }

        /* ---------- Tarjeta ---------- */
        .card {
            text-align: center;
            background: var(--md-sys-color-surface-container-low);
            border-radius: 32px;
            padding: 44px 28px;
            box-shadow: 0 1px 2px color-mix(in srgb, var(--md-sys-color-shadow) 12%, transparent),
            0 16px 40px color-mix(in srgb, var(--md-sys-color-shadow) 10%, transparent);
            animation: rise .5s cubic-bezier(.2, .8, .2, 1) both;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-icon {
            width: 104px;
            height: 104px;
            margin: 0 auto 24px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            position: relative;
            animation: pop .6s cubic-bezier(.2, 1.4, .4, 1) both;
        }

        .success-icon::after {
            content: '';
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            border: 2px solid color-mix(in srgb, var(--md-sys-color-primary) 40%, transparent);
            animation: halo 1.8s ease-out .35s infinite;
        }

        .success-icon md-icon {
            font-size: 58px;
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: scale(.4);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes halo {
            0% {
                transform: scale(.9);
                opacity: .8;
            }
            70%, 100% {
                transform: scale(1.18);
                opacity: 0;
            }
        }

        h1 {
            font-size: clamp(1.6rem, 5vw, 2.1rem);
            font-weight: 700;
            margin: 0 0 12px;
            line-height: 1.2;
        }

        .subtitle {
            margin: 0 auto 12px;
            max-width: 420px;
            color: var(--md-sys-color-on-surface-variant);
            line-height: 1.55;
        }

        .note {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 14px 0 30px;
            padding: 10px 16px;
            border-radius: 999px;
            font-size: .85rem;
            background: var(--md-sys-color-secondary-container);
            color: var(--md-sys-color-on-secondary-container);
        }

        .note md-icon {
            font-size: 18px;
        }

        .actions {
            display: flex;
            justify-content: center;
        }

        @media (prefers-reduced-motion: reduce) {
            .card, .success-icon, .success-icon::after {
                animation: none;
            }
        }
    </style>
</head>
<body>
<main class="shell">

    <header class="brand">
        <span class="brand-logo"><md-icon aria-hidden="true">content_cut</md-icon></span>
        <span class="brand-text">
            <span class="brand-name">LA TERCERA BARBERSHOP</span>
            <span class="brand-sub">Reserva de turnos online</span>
        </span>
    </header>

    <section class="card">
        <div class="success-icon">
            <md-icon aria-hidden="true">check</md-icon>
        </div>

        <h1>¡Reserva confirmada!</h1>
        <p class="subtitle">Tu turno quedó registrado. Te esperamos en el local unos minutos antes del horario
            reservado.</p>

        <p class="note">
            <md-icon aria-hidden="true">phone</md-icon>
            Si necesitás cambios, contactanos al local.
        </p>

        <div class="actions">
            <md-filled-button th:href="@{/public-booking}"
                              type="button">
                <md-icon aria-hidden="true" slot="icon">home</md-icon>
                Volver al inicio
            </md-filled-button>
        </div>
    </section>
</main>
</body>
</html>
